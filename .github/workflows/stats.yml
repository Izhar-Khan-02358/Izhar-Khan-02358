
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Dynamic GitHub Stats Card
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          mkdir -p profile

          node <<'NODE'
          const fs = require("fs");

          const username = "Izhar-Khan-02358";
          const token = process.env.METRICS_TOKEN;

          async function main() {
            if (!token) {
              throw new Error("METRICS_TOKEN secret is missing");
            }

            const query = `
              query(
                $login: String!,
                $from: DateTime!,
                $to: DateTime!,
                $prs: String!,
                $merged: String!,
                $issues: String!
              ) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) {
                    totalCommitContributions
                  }
                }

                allPRs: search(query: $prs, type: ISSUE) {
                  issueCount
                }

                mergedPRs: search(query: $merged, type: ISSUE) {
                  issueCount
                }

                issues: search(query: $issues, type: ISSUE) {
                  issueCount
                }
              }
            `;

            const variables = {
              login: username,
              from: new Date(
                Date.now() - 365 * 24 * 60 * 60 * 1000
              ).toISOString(),
              to: new Date().toISOString(),
              prs: `author:${username} type:pr`,
              merged: `author:${username} type:pr is:merged`,
              issues: `author:${username} type:issue`
            };

            const response = await fetch(
              "https://api.github.com/graphql",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  query,
                  variables
                })
              }
            );

            const result = await response.json();

            if (!response.ok || result.errors) {
              throw new Error(
                JSON.stringify(result.errors || result)
              );
            }

            const data = result.data;

            const stats = [
              {
                label: "TOTAL COMMITS",
                value: data.user.contributionsCollection.totalCommitContributions,
                color: "#58a6ff"
              },
              {
                label: "PULL REQUESTS",
                value: data.allPRs.issueCount,
                color: "#bc8cff"
              },
              {
                label: "MERGED PRs",
                value: data.mergedPRs.issueCount,
                color: "#3fb950"
              },
              {
                label: "ISSUES OPENED",
                value: data.issues.issueCount,
                color: "#f0883e"
              }
            ];

            const cards = stats.map((stat, index) => {
              const x = 105 + index * 198;

              return `
                <g>
                  <rect
                    x="${x}" y="92"
                    width="178" height="116"
                    rx="13"
                    fill="#161b22"
                    stroke="#30363d"
                  />

                  <rect
                    x="${x}" y="92"
                    width="178" height="4"
                    rx="2"
                    fill="${stat.color}"
                  />

                  <circle
                    cx="${x + 24}" cy="125"
                    r="5"
                    fill="${stat.color}"
                  />

                  <text
                    x="${x + 17}" y="166"
                    fill="#f0f6fc"
                    font-size="32"
                    font-weight="700"
                  >${stat.value.toLocaleString("en-US")}</text>

                  <text
                    x="${x + 17}" y="188"
                    fill="#8b949e"
                    font-size="12"
                    font-weight="600"
                    letter-spacing="0.5"
                  >${stat.label}</text>
                </g>
              `;
            }).join("");

            const svg = `
              <svg xmlns="http://www.w3.org/2000/svg"
                   width="1000" height="245"
                   viewBox="0 0 1000 245">

                <defs>
                  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#0d1117"/>
                    <stop offset="100%" stop-color="#161b22"/>
                  </linearGradient>
                </defs>

                <rect width="1000" height="245" rx="16"
                      fill="url(#bg)"
                      stroke="#30363d"/>

                <text x="28" y="48"
                      fill="#58a6ff"
                      font-size="23"
                      font-weight="700">
                  GitHub Statistics
                </text>

                <text x="28" y="70"
                      fill="#8b949e"
                      font-size="13">
                  Developer activity • Automatically updated
                </text>

                ${cards}

                <text x="28" y="230"
                      fill="#8b949e"
                      font-size="11">
                  Public GitHub activity • Updated automatically
                </text>

                <text x="970" y="230"
                      text-anchor="end"
                      fill="#8b949e"
                      font-size="11">
                  GitHub API
                </text>
              </svg>
            `;

            fs.mkdirSync("profile", {
              recursive: true
            });

            fs.writeFileSync(
              "profile/stats.svg",
              svg.trim()
            );

            console.log(
              "GitHub stats card generated successfully!"
            );

            console.log(stats);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp profile/stats.svg /tmp/stats.svg

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p profile
            cp /tmp/stats.svg profile/stats.svg

            git add profile/stats.svg

            if git diff --cached --quiet; then
              echo "Statistics are already up to date."
              exit 0
            fi

            git commit -m "Update GitHub statistics [skip ci]"

            if git push origin HEAD:main; then
              echo "Statistics successfully pushed!"
              exit 0
            fi

            echo "Push rejected. Retrying..."
          done

          echo "Failed to push after 3 attempts."
          exit 1


name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          user: Izhar-Khan-02358
          filename: profile/stats.svg

          # Remove profile header and username
          base: activity, community, repositories, metadata
          base_indepth: yes

          # Improved layout
          config_display: columns
          config_padding: 24
          config_animations: yes
          config_timezone: Asia/Kolkata

          # Custom styling
          extras_css: |
            h2 {
              color: #58a6ff;
              font-weight: 700;
            }

            a {
              color: #79c0ff;
            }

          retries: 3
          retries_delay: 300
